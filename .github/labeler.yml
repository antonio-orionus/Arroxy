# Path labels for pull requests, applied by .github/workflows/labeler.yml.
# Label names match the ones GitHub and Dependabot already use where one exists.

tests:
  - changed-files:
      - any-glob-to-any-file:
          - 'tests/**'
          - 'packages/*/tests/**'
          - '**/*.test.*'
          - '**/*.spec.*'
          - 'playwright.config.ts'

documentation:
  - changed-files:
      - any-glob-to-any-file:
          - 'docs/**'
          - 'dev-docs/**'
          - 'readme-src/**'
          - '**/*.md'

i18n:
  - changed-files:
      - any-glob-to-any-file:
          - 'i18n/**'
          - 'src/shared/i18n/**'

dependencies:
  - changed-files:
      - any-glob-to-any-file:
          - 'package.json'
          - 'packages/*/package.json'
          - 'bun.lock'
