name: Dev Smoke

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  BUN_VERSION: '1.4.2'

permissions:
  contents: read

jobs:
  # Skips this suite on a pull request that cannot affect it; see
  # .github/actions/app-changes for what counts.
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      run: ${{ steps.changes.outputs.run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          sparse-checkout: .github/actions
      - id: changes
        uses: ./.github/actions/app-changes
        with:
          scope: browser

  dev-smoke:
    name: Dev smoke (${{ matrix.label }})
    needs: changes
    if: ${{ needs.changes.outputs.run == 'true' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - os: windows-latest
            label: windows
          - os: macos-latest
            label: macos-arm64
          - os: ubuntu-latest
            label: linux

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .node-version

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Cache bun dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.bun/install/cache
          key: ${{ matrix.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ matrix.os }}-bun-

      - name: Bootstrap checkout
        env:
          BTBN_GITHUB_TOKEN: ${{ github.token }}
        run: bun run bootstrap

      - name: Inspect checkout readiness
        run: bun run doctor

      - name: Install Linux browser system dependencies
        if: runner.os == 'Linux'
        run: bunx playwright install chromium --with-deps

      - name: Run browser-mock dev smoke
        run: bun run test:browser:smoke

      - name: Upload browser smoke artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: dev-smoke-playwright-${{ matrix.label }}
          path: |
            test-results
            tests/browser/screenshots
          if-no-files-found: ignore
          retention-days: 7

  # The required check: passes only when the filter ran and, if the suite had
  # to run, every job above passed (see .github/actions/suite-gate).
  gate:
    name: Dev smoke gate
    needs: [changes, dev-smoke]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          sparse-checkout: .github/actions
      - uses: ./.github/actions/suite-gate
        with:
          suite: Dev smoke
          needs: ${{ toJSON(needs) }}
          run: ${{ needs.changes.outputs.run }}
