name: Issue policy

# What an issue a maintainer files must carry (scripts/issuePolicy.ts): one kind
# label, one state label while open, a `file:line` for a bug, test gap or tech debt, no pointers to the
# private maintainer docs, and no AI credited with finding it. Community issues
# come through the issue forms and are skipped.
#
# An issue can't be blocked, so a failing one gets the needs-triage label and
# one comment saying what to fix; the label comes off when an edit passes.
# Each run reads the issue fresh, so a queued run never re-flags or leaves
# flagged an issue an earlier run already settled. Labels added with
# GITHUB_TOKEN don't trigger workflows, so this never loops.
on:
  issues:
    types: [opened, edited, reopened, labeled, unlabeled]

# One run at a time per issue, never cancelled mid-way: a cancelled run could
# leave the label added without its comment. A burst of edits queues, and the
# last edit's run gives the final verdict.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.issue.number }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  BUN_VERSION: '1.4.2'

permissions:
  contents: read
  issues: write

jobs:
  issue-policy:
    name: issue-policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}

      # The issue as it is now, not the event payload: a queued run's payload
      # can predate a later edit or a label an earlier run set, and queued runs
      # aren't guaranteed to keep their order. A plain redirect, so a failed
      # lookup fails the job instead of judging an empty issue.
      - name: Read the issue as it is now
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.issue.number }}
        run: gh issue view "$NUMBER" --json title,body,labels,state > "$RUNNER_TEMP/issue.json"

      # The checker has no dependencies, so no install.
      - name: Check the issue
        id: check
        env:
          ISSUE_FILE: ${{ runner.temp }}/issue.json
          ISSUE_AUTHOR_ASSOCIATION: ${{ github.event.issue.author_association }}
          ISSUE_REPORT: ${{ runner.temp }}/issue-policy.md
        run: bun scripts/check-issue-policy.ts

      # The comment goes first: a run whose comment fails leaves the issue
      # unflagged, so the next run tries both again. The other order left a
      # flagged issue with no comment that every later run skipped. A label
      # that fails after the comment posted means a repeated comment next run.
      - name: Flag the issue
        if: ${{ steps.check.outputs.verdict == 'fail' && steps.check.outputs.flagged == 'false' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.issue.number }}
        run: |
          gh issue comment "$NUMBER" --body-file "$RUNNER_TEMP/issue-policy.md"
          gh issue edit "$NUMBER" --add-label needs-triage

      - name: Clear the flag
        if: ${{ steps.check.outputs.verdict == 'pass' && steps.check.outputs.flagged == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.issue.number }}
        run: gh issue edit "$NUMBER" --remove-label needs-triage
