name: FFmpeg Remux Matrix

# Proves each approved FFmpeg build handles the media YouTube serves before a
# change to it merges. A merged pin reaches every user within a day through the
# daily manifest, and nobody upstream tests this: yt-dlp names no FFmpeg
# version and none of its CI runs ffmpeg. A martin-riedl nightly (N-125070)
# once segfaulted on every MP4 output with two or more streams whose first
# stream has a 1/1000 time base: WebM video, and YouTube's HLS VP9 (itag 616),
# merged with any audio. Single streams and MKV output worked. The
# known-bad-control job keeps the matrix able to catch that build.
#
# Each job runs scripts/ffmpeg-matrix on one platform, twice:
# - the pinned FFmpeg package, downloaded from its release and installed with
#   the app's own installer (FfmpegPackagePins.ts);
# - the dev payload fetch-embedded.sh resolves (btbnResolver.ts), which dev
#   builds and the fixture E2E suites run.
# Every case runs the exact ffmpeg command yt-dlp or Arroxy would, against
# committed fixtures; see dev-docs/ffmpeg-packages.md. Not part of
# `bun run check`, which runs without real FFmpeg builds.

# Every PR and push runs the `changes` job, and every run ends in `gate`, the
# check branch protection requires. The matrix jobs run only when a path in the
# filter below changed, so an unrelated PR passes the gate in seconds instead of
# waiting on a check that never starts. The weekly schedule re-checks every
# published pin URL and the known-bad control when nothing changed.
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '23 4 * * 1'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  BUN_VERSION: '1.4.2'

permissions:
  contents: read

jobs:
  # The filter lists every file the matrix runs, through its own imports: what
  # users install (the pins, the package installer and its download path) and
  # how ffmpeg runs (the spawn environment and Arroxy's own ffmpeg arguments).
  # tests/scripts/ffmpeg-remux-matrix-workflow.test.ts fails when a new import
  # of the matrix falls outside it.
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      run: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || steps.filter.outputs.matrix == 'true' }}
    steps:
      # Pull requests read the changed files from the API; pushes diff with git.
      - if: ${{ github.event_name == 'push' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 2
          persist-credentials: false
      - id: filter
        if: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            matrix:
              - .github/workflows/ffmpeg-remux-matrix.yml
              - scripts/build/btbnResolver.ts
              - scripts/build/fetch-embedded.sh
              - scripts/build/ffmpegPackage.ts
              - scripts/ffmpeg-matrix/**
              - src/main/services/binary/ArtifactInstall.ts
              - src/main/services/binary/BinaryDownloader.ts
              - src/main/services/binary/BinaryProbe.ts
              - src/main/services/binary/FfmpegPackageMaterializer.ts
              - src/main/services/binary/FfmpegPackagePins.ts
              - src/main/services/subtitleEmbedArgs.ts
              - src/main/utils/process.ts
              - src/shared/runtimeBinaryManifest.ts
              - src/shared/runtimeBinarySchemas.ts
              - tests/fixtures/ffmpeg-remux/**

  # One job per pin, so a pin added without a runner fails here instead of
  # going untested.
  targets:
    needs: changes
    if: ${{ needs.changes.outputs.run == 'true' }}
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.targets.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - id: targets
        run: bun scripts/ffmpeg-matrix/ci-targets.ts

  matrix:
    name: ${{ matrix.target }} (${{ matrix.version }})
    needs: targets
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.targets.outputs.matrix) }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile

      - name: Remux matrix on the pinned FFmpeg package
        id: pinned
        env:
          TARGET: ${{ matrix.target }}
        run: >-
          bun scripts/ffmpeg-matrix/run.ts
          --pinned "$TARGET"
          --cache-root "$RUNNER_TEMP/ffmpeg-packages"
          --title "$TARGET pinned package"
          --report "$RUNNER_TEMP/remux-matrix-pinned.md"
          --json "$RUNNER_TEMP/remux-matrix-pinned.json"

      - name: Fetch the dev payload
        if: ${{ !cancelled() }}
        env:
          BTBN_GITHUB_TOKEN: ${{ github.token }}
        run: bun run embed:fetch:host

      - name: Remux matrix on the dev payload
        if: ${{ !cancelled() }}
        env:
          TARGET: ${{ matrix.target }}
        run: |
          exe=''
          if [[ "$TARGET" == win32-* ]]; then exe='.exe'; fi
          bun scripts/ffmpeg-matrix/run.ts \
            --ffmpeg "build/embedded/$TARGET/ffmpeg$exe" \
            --title "$TARGET dev payload" \
            --report "$RUNNER_TEMP/remux-matrix-embedded.md" \
            --json "$RUNNER_TEMP/remux-matrix-embedded.json"

      - name: Upload matrix reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ffmpeg-remux-matrix-${{ matrix.target }}
          path: ${{ runner.temp }}/remux-matrix-*
          if-no-files-found: ignore
          retention-days: 14

  # The matrix must keep failing the build that broke downloads, or a change to
  # the fixtures or cases has made it blind to that crash. N-125070 is
  # martin-riedl's macOS arm64 master build; checksum-pinned, ffmpeg only, so
  # the outputs are probed with the pinned package's ffprobe.
  known-bad-control:
    name: known-bad control (darwin-arm64 N-125070)
    needs: changes
    if: ${{ needs.changes.outputs.run == 'true' }}
    runs-on: macos-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    env:
      BAD_URL: https://ffmpeg.martin-riedl.de/download/macos/arm64/1781693612_N-125070-gd69e8d0a95/ffmpeg.zip
      BAD_SHA256: 901de66570758a415e768bbbf23e535ab0524892061cc6b70505196df24a8d9d
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile

      - name: Fetch the known-bad ffmpeg and the pinned ffprobe
        id: tools
        run: |
          bad="$RUNNER_TEMP/known-bad"
          mkdir -p "$bad"
          curl -fsSL --retry 3 -o "$bad/ffmpeg.zip" "$BAD_URL"
          echo "$BAD_SHA256  $bad/ffmpeg.zip" | shasum -a 256 -c -
          unzip -q "$bad/ffmpeg.zip" -d "$bad"
          chmod +x "$bad/ffmpeg"
          root="$(bun scripts/build/ffmpegPackage.ts install --platform darwin --arch arm64 --cache-root "$RUNNER_TEMP/ffmpeg-packages" | tail -n 1)"
          if [[ ! -x "$root/ffprobe" ]]; then
            echo "::error::the pinned darwin-arm64 package install gave no ffprobe at '$root'"
            exit 1
          fi
          echo "ffmpeg=$bad/ffmpeg" >> "$GITHUB_OUTPUT"
          echo "ffprobe=$root/ffprobe" >> "$GITHUB_OUTPUT"

      - name: Remux matrix must fail on the known-bad build
        env:
          FFMPEG: ${{ steps.tools.outputs.ffmpeg }}
          FFPROBE: ${{ steps.tools.outputs.ffprobe }}
        run: |
          set +e
          bun scripts/ffmpeg-matrix/run.ts --ffmpeg "$FFMPEG" --ffprobe "$FFPROBE" \
            --title "known-bad control" --json "$RUNNER_TEMP/known-bad.json"
          status=$?
          set -e
          if [[ $status -ne 1 ]]; then
            echo "::error::the remux matrix exited $status on the known-bad build; it must fail (exit 1)"
            exit 1
          fi
          for id in merge/vp9-hls+aac.mp4 merge/vp9-dash+aac.mp4; do
            detail="$(jq -r --arg id "$id" '.results[] | select(.id == $id and .status == "fail" and .stage == "ffmpeg") | .detail' "$RUNNER_TEMP/known-bad.json")"
            if [[ "$detail" != "signal SIGSEGV" ]]; then
              echo "::error::$id did not crash the known-bad build (got: ${detail:-no ffmpeg failure})"
              exit 1
            fi
          done
          echo "The matrix still catches the N-125070 crash."

  # The required check. It always runs and passes only when the filter ran and,
  # if the matrix had to run, every matrix job passed. A skipped matrix after a
  # failed `changes` or `targets` job fails it.
  gate:
    name: FFmpeg remux gate
    needs: [changes, targets, matrix, known-bad-control]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - env:
          NEEDS: ${{ toJSON(needs) }}
          RUN: ${{ needs.changes.outputs.run }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          if [[ "$RUN" == 'true' ]]; then
            echo "$NEEDS" | jq -e 'all(.[]; .result == "success")' > /dev/null || { echo '::error::the FFmpeg remux matrix did not pass'; exit 1; }
            echo 'The remux matrix passed.'
          else
            echo "$NEEDS" | jq -e '.changes.result == "success"' > /dev/null || { echo '::error::the path filter did not run'; exit 1; }
            echo 'No matrix-relevant path changed; the matrix was skipped.'
          fi
