name: CI

# Feature branches are covered by the pull_request run; pushing them as well
# ran the same suite twice per commit. main still runs on push because
# scripts/release.sh verifies the required checks on the main commit.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  # A pull request cancels its superseded runs. Every other run (each push to
  # main, each tag) gets a group of its own and always finishes, so every main
  # commit gets a verdict the release script can read.
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}${{ github.event_name != 'pull_request' && format('-{0}', github.sha) || '' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  BUN_VERSION: '1.4.2'

permissions:
  contents: read

jobs:
  # `bun run check` split across runners. On one runner the unit tests took
  # about 6.5 minutes and every other gate shared its CPUs, so the gate set the
  # wait for every push. `check` is the context branch protection requires.

  # Every gate of `bun run check` except the unit tests, which run below.
  gates:
    runs-on: ubuntu-latest
    env:
      CHECK_TESTS_SEPARATELY: '1'

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .node-version

      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check
        run: bun run check

  test:
    name: test (linux ${{ matrix.shard }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: ['1/3', '2/3', '3/3']

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .node-version

      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Test
        run: bun run test --shard=${{ matrix.shard }}

  # The full gate runs on Linux only. This leg exists for the class of bug that
  # is invisible there: path separators, CRLF checkouts, and shell shims that
  # spawn without a shell on POSIX but not on Windows. Everyone working on this
  # repo develops on macOS or Linux, so without a Windows leg those regressions
  # reach contributors before they reach CI. Only the test suite: the rest of
  # the gate (formatting, tooling parity, i18n catalogs, package packing) is
  # platform-independent and already covered above.
  test-windows:
    name: test (windows ${{ matrix.shard }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        shard: ['1/2', '2/2']

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .node-version

      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Test
        run: bun run test --shard=${{ matrix.shard }}

  # The required context: passes only when every part above passed, so a
  # skipped or cancelled part fails it too.
  check:
    name: check
    if: always()
    needs: [gates, test, test-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Every part passed
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          echo "$RESULTS"
          test "$(jq -r 'all(. == "success")' <<< "$RESULTS")" = true
