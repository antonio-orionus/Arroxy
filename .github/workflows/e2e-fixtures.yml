name: E2E Fixtures

# Acceptance layer for real product workflows: real Electron, real IPC, real
# yt-dlp, real filesystem output, with only the video platform made
# deterministic by the fixture extractor plugin, local media server, and deny
# proxy. This suite existed for a long time without ever running in CI, which is
# how a batch of stale selectors and a silent resume-after-restart bug survived.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  # A pull request cancels its superseded runs. Every other run (each push to
  # main, each tag) gets a group of its own and always finishes, so every main
  # commit gets a verdict the release script can read.
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}${{ github.event_name != 'pull_request' && format('-{0}', github.sha) || '' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  BUN_VERSION: '1.4.2'

permissions:
  contents: read

jobs:
  # Skips this suite on a change that cannot affect it; see
  # .github/actions/app-changes for what counts.
  changes:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      pull-requests: read
    outputs:
      run: ${{ steps.changes.outputs.run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          sparse-checkout: .github/actions
      - id: changes
        uses: ./.github/actions/app-changes
        with:
          scope: e2e

  fixtures:
    name: Fixture product E2E (${{ matrix.shard }}/${{ strategy.job-total }})
    needs: changes
    if: ${{ needs.changes.outputs.run == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Split across runners rather than Playwright workers: each runner gets its
    # own xvfb display, so focus-dependent specs (clipboard, hotkey) never
    # compete for one window manager. Serial on one runner this took ~10 min
    # and set the wall-clock of every PR.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Cache bun dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.bun/install/cache
          key: ubuntu-latest-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ubuntu-latest-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Electron needs the browser system libraries; xvfb provides the display
      # the suite runs against.
      - name: Install Playwright system dependencies
        run: bunx playwright install chromium --with-deps

      - name: Install xvfb
        run: sudo apt-get update && sudo apt-get install -y xvfb

      # Fetches embedded ffmpeg/ffprobe for the host, builds, then runs this
      # runner's shard of the fixture specs serially under a virtual display.
      - name: Run fixture product E2E
        env:
          BTBN_GITHUB_TOKEN: ${{ github.token }}
          SHARD: ${{ matrix.shard }}/${{ strategy.job-total }}
        run: bun run test:e2e:fixtures:ci --shard="$SHARD"

      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: fixture-e2e-playwright-${{ matrix.shard }}
          path: test-results
          if-no-files-found: ignore
          retention-days: 7

  # Windows refuses paths past 260 characters, a limit the Linux shards never
  # meet, so the scenario that downloads into a folder near the limit (tagged
  # @path-limit) also runs here. Only that scenario: the shards run the rest.
  windows-path-limit:
    name: Fixture product E2E (Windows path limit)
    needs: changes
    if: ${{ needs.changes.outputs.run == 'true' }}
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .node-version

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Cache bun dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.bun/install/cache
          key: windows-latest-bun-${{ hashFiles('bun.lock') }}
          restore-keys: windows-latest-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Same entry point as the shards; on Windows it runs with a hidden window.
      - name: Run the path-limit scenario
        env:
          BTBN_GITHUB_TOKEN: ${{ github.token }}
        run: bun run test:e2e:fixtures:ci --grep "@path-limit"

      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: fixture-e2e-playwright-windows-path-limit
          path: test-results
          if-no-files-found: ignore
          retention-days: 7

  # The required check: passes only when the filter ran and, if the suite had
  # to run, every job above passed (see .github/actions/suite-gate).
  gate:
    name: E2E fixtures gate
    needs: [changes, fixtures, windows-path-limit]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          sparse-checkout: .github/actions
      - uses: ./.github/actions/suite-gate
        with:
          suite: E2E fixtures
          needs: ${{ toJSON(needs) }}
          run: ${{ needs.changes.outputs.run }}
