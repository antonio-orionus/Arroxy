name: App changes
description: Whether a pull request or a push to the default branch changed a file that can affect a heavy app suite (E2E, browser smoke, Windows installer)

# The heavy suites skip a change that only touches files they cannot run:
# docs, agent tooling, translation sources, unit tests, the remux matrix.
# Everything else counts, so a new top-level file or directory runs the suites
# until someone lists it here. Tags, schedules and manual runs always run.
#
# A push to the default branch is filtered against the commit before it, and
# only when this workflow's push run on that commit passed. A skipped run
# reports a green gate for its commit, which the release script trusts, so it
# must never sit on top of a failed, cancelled or unfinished run: then the
# suite runs, and the commits it covers get tested after all.
# tests/scripts/app-changes-action.test.ts pins what each scope runs on.
#
# Callers must check out the repository first (a sparse checkout of
# .github/actions is enough) and grant `actions: read` and
# `pull-requests: read`.

inputs:
  scope:
    description: e2e (fixture E2E, cold start), browser (dev smoke) or installer (Windows installer)
    required: true

outputs:
  run:
    description: "'true' when the suite has to run"
    value: ${{ steps.filter.outcome != 'success' || steps.filter.outputs[inputs.scope] == 'true' }}

runs:
  using: composite
  steps:
    - id: previous
      if: ${{ github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && github.event.before != '0000000000000000000000000000000000000000' }}
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        BEFORE: ${{ github.event.before }}
        BRANCH: ${{ github.ref_name }}
      run: |
        workflow="${GITHUB_WORKFLOW_REF%@*}"
        workflow="${workflow##*/}"
        # A failed lookup runs the suite rather than failing the gate.
        conclusion=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$workflow/runs?event=push&branch=$BRANCH&head_sha=$BEFORE&per_page=1" --jq '.workflow_runs[0].conclusion // "none"') || conclusion=unknown
        echo "This workflow's run on $BEFORE: $conclusion"
        echo "conclusion=$conclusion" >> "$GITHUB_OUTPUT"
    - id: filter
      if: ${{ github.event_name == 'pull_request' || steps.previous.outputs.conclusion == 'success' }}
      uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
      with:
        predicate-quantifier: some-with-excludes
        filters: |
          # Cannot reach the built, packaged or running app. CHANGELOG.md is
          # missing on purpose: the renderer imports it. Its fragments in
          # changelog.d/ reach the app only once a release assembles them.
          base: &base
            - '**'
            - '!.agents/**'
            - '!.claude/**'
            - '!.coderabbit.yaml'
            - '!.github/CODEOWNERS'
            - '!.github/FUNDING.yml'
            - '!.github/ISSUE_TEMPLATE/**'
            - '!.github/dependabot.yml'
            - '!.github/pull_request_template.md'
            - '!.vite-hooks/**'
            - '!AGENTS.md'
            - '!CLAUDE.md'
            - '!CONTRIBUTING.md'
            - '!DESIGN.md'
            - '!DONATE.md'
            - '!GLOSSARY.md'
            - '!PRODUCT.md'
            - '!README.md'
            - '!changelog.d/**'
            - '!dev-docs/**'
            - '!docs/**'
            - '!flatpak/**'
            - '!i18n/**'
            - '!packages/*/CHANGELOG.md'
            - '!packages/*/README.md'
            - '!packages/*/tests/**'
            - '!readme-src/**'
            - '!scripts/ffmpeg-matrix/**'
            - '!scripts/vm/**'
            - '!skills-lock.json'
            - '!tests/__mocks__/**'
            - '!tests/fixtures/**'
            - '!tests/helpers/**'
            - '!tests/integration/**'
            - '!tests/main/**'
            - '!tests/renderer/**'
            - '!tests/screenshots/**'
            - '!tests/scripts/**'
            - '!tests/setup.ts'
            - '!tests/shared/**'
            - '!tests/unit/**'
            - '!tests/vitest-jest-dom.d.ts'
            - '!workers/**'
          e2e:
            - *base
            - '!playwright.browser.config.ts'
            - '!playwright.screenshots.config.ts'
            - '!tests/browser/**'
          browser:
            - *base
            - '!playwright.config.ts'
            - '!playwright.screenshots.config.ts'
            - '!tests/e2e/**'
          installer:
            - *base
            - '!playwright*.config.ts'
            - '!tests/**'
