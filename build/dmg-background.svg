  </g>
  <text x="300" y="67" text-anchor="middle" fill="#172033" font-family="Poppins, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="22" font-weight="700">Drag Arroxy to Applications</text>
  <text x="300" y="91" text-anchor="middle" fill="#586277" font-family="Poppins, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="500">then launch it from your Applications folder</text>

