<svg xmlns="http://www.w3.org/2000/svg" width="600" height="360" viewBox="0 0 600 360" role="img" aria-label="Drag Arroxy to Applications">
  <defs>
    <linearGradient id="page" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fbff"/>
      <stop offset="0.6" stop-color="#edf8ff"/>
      <stop offset="1" stop-color="#fff6ef"/>
    </linearGradient>
    <linearGradient id="ribbon" x1="-10" y1="270" x2="610" y2="138" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0ea5e9" stop-opacity="0.2"/>
      <stop offset="0.55" stop-color="#22c55e" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#f97316" stop-opacity="0.12"/>
    </linearGradient>
    <linearGradient id="arrow" x1="254" y1="222" x2="346" y2="222" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1598e8"/>
      <stop offset="1" stop-color="#22a364"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="9" stdDeviation="16" flood-color="#0f172a" flood-opacity="0.12"/>
