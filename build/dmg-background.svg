  </defs>

  <rect width="600" height="360" fill="url(#page)"/>
  <path d="M-46 284C68 207 144 176 247 193C367 213 397 120 496 98C554 85 600 96 648 123V360H-46Z" fill="url(#ribbon)"/>
  <path d="M0 300C84 266 166 269 256 300C354 334 459 326 600 279V360H0Z" fill="#ffffff" opacity="0.47"/>

