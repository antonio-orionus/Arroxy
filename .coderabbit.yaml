  # Same priorities as the maintainer's local dual review: correctness, not
  # security hardening, which the owner ruled out of scope for this desktop app.
  path_instructions:
    - path: "**/*"
      instructions: >-
        Report defects the author would fix: wrong behavior, broken contracts, races, lost data,
        platform bugs. Do not raise security hardening, threat models or attack scenarios; Arroxy is
        a desktop app and security review is out of scope. Follow the reviewer rules in
        .agents/memory/review-learnings.md.
    - path: .github/workflows/**
      instructions: >-
        Review GitHub Actions for correctness: release/tag behavior, job and needs wiring, artifact
        handling, shell quoting, and commands that can fail silently. A secret must never reach a
        log or an artifact.
    - path: scripts/**
      instructions: >-
        Review shell and Node/Bun scripts for quoting and word splitting, platform-specific
        assumptions (macOS, Linux, Windows), missing error handling, commands that can fail
        silently, and release/build reproducibility.
    - path: src/main/**
      instructions: >-
        This is Electron main-process code. Prioritize IPC contracts and validation of
        renderer-provided input where it enters as unknown, filesystem and path handling across
        platforms, child-process lifecycle, updater/download behavior, and error handling.
    - path: src/preload/**
      instructions: >-
        This is Electron preload code. Check that the bridge matches the typed API contract in
        src/shared and forwards each call to the matching IPC channel.
    - path: src/renderer/**
      instructions: >-
        Review React/UI code for state correctness, accessibility, i18n regressions, IPC misuse,
        race conditions, and user-facing error handling. Avoid style-only nitpicks unless they
        affect maintainability.
    - path: tests/**
      instructions: >-
        Prioritize meaningful coverage, determinism, and whether tests validate behavior. Do not
        nitpick formatting or implementation style unless it makes the test unreliable.
  slop_detection:
    label: needs-human-review
knowledge_base:
  code_guidelines:
    enabled: true
    # Read on top of the defaults (AGENTS.md, CLAUDE.md), so refuted findings recorded there stop
    # coming back. A plain entry would only govern .agents/memory/ (its own directory), which
    # path_filters excludes; applyTo makes it govern the whole repo.
    filePatterns:
      - files: .agents/memory/review-learnings.md
        applyTo: "**/*"
